<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Kevin</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

    <script>
        tailwind: config = {
            theme:{
                extend: {
                    colors: {
                        primary: '#000000', // Warna Hitam
                        secondary: '#ADFF2F', // Warna Lime Green
                        tertiary: 'FFFFFF', // Warna Putih
                        neutral: '#777777' // Warna Abu Abu
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    boxShadow: {
                        brutal: '8px 8px 0px 0px #000000',
                        brutalHover: '4px 4px 0px 0px #000000',
                        brutalSolid: '12px 12px 0px 0px #000000'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-mono antialiased selection:bg-primary selection: text-secondary cursor-default">
    <div id="brutal-cursor" class="hidden md:block"></div>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-tertiary border-b-4 border-primary transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
            
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="#home" class="hover-shake font-sans font-black text-2xl tracking-tighter bg-primary text-secondary px-3 py-1 border-2 border-primary transform -skew-x-6 transition-transform shadow-[4px_4px_0px_0px_#ADFF2F]">
                        KEVIN.DEX
                    </a>
                </div>

                <!-- Menu -->
                <div class="hidden md:flex space-x-8 font-mono font-bold uppercase text-sm lg:text-base items-center">
                    <a href="#About" class="text-primary hover:bg-secondary hover:px-2 transition-all py-1">About</a>
                    <a href="#Skills" class="text-primary hover:bg-secondary hover:px-2 transition-all py-1">Skills</a>
                    <a href="#Project" class="text-primary hover:bg-secondary hover:px-2 transition-all py-1">Project</a>
                    <a href="#Certificate" class="text-primary hover:bg-secondary hover:px-2 transition-all py-1">Certificate</a>
                </div>

                 <!-- Button CTA -->
                <div class="hidden md:flex">
                    <a href="#Contact" class="font-mono font-bold bg-secondary text-primary border-4 border-primary px-6 py-2 shadow-brutal hover:shadow-brutalHover hover:translate-x-1 hover:translate-y-1 transition-all uppercase">>
                        Let's Work
                    </a>
                </div>

                <!-- Menu Mobile -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" class="font-mono font-bold border-4 border-primary bg-secondary px-4 py-2 hover:bg-primary hover:text-secondary transition-colors uppercase">
                        Menu
                    </button>
                </div>
            </div>
        </div>

        <!-- Menu Mobile -->
        <div id="mobile-menu" class="hidden md:hidden bg-tertiary border-b-4 border-primary shadow-brutal relative z-40">
            <div class="px-4 pt-2 pb-6 space-y-2 font-mono font-bold uppercase text-center">
                <a href="#About" class="block text-primary hover:bg-secondary py-3 border-b-2 border-primary"> About </a>
                <a href="#Skills" class="block text-primary hover:bg-secondary py-3 border-b-2 border-primary"> Skills </a>
                <a href="#Project" class="block text-primary hover:bg-secondary py-3 border-b-2 border-primary"> Project </a>
                <a href="#Certificate" class="block text-primary hover:bg-secondary py-3 border-b-2 border-primary"> Certificate </a>
                <a href="#Contact" class="bloxk text-primary hover:bg-secondary py-3 bg-secondary border-4 border-primary mt-4"> Lets Work </a>
            </div>
        </div>
    </nav>


    <!-- About Section -->
    <section id="about" class="pt-32 pb-20 px-4 md:px-10 max-w-7xl mx-auto flex flex-col-reverse md:flex-row items-center gap-10 min-h-screen md:min-h-0 relative">
        <div class="w-full md:w-2/3 relative z-10 reveal-target"></div>
    </section>
</body>
</html>
